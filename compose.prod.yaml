# Production, serveur srv-gouv.ipscnam.ci : podman compose -f compose.prod.yaml up -d --build
# Les secrets sont lus dans le fichier .env du dossier (non versionné, chmod 600).
# Machine partagée avec d'autres applications (ÉCHO sur 80/443) : un seul port publié, le 8443.
name: dq-analyzer

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: dq-postgres
    restart: always
    # Aucun "ports" : la base n'est joignable que par le réseau interne de Podman.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      # Lu par db/init/01-create-database.sh, au premier démarrage seulement
      DQ_DB_PASSWORD: ${DQ_DB_PASSWORD:?à définir dans .env}
    volumes:
      - dq-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: localhost/dq-analyzer:prod
    container_name: dq-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    # Aucun "ports" : seul le proxy parle à l'application, par le réseau interne.
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DQ_DB_URL: jdbc:postgresql://postgres:5432/dqanalyzer
      DQ_DB_USER: dqanalyzer
      DQ_DB_PASSWORD: ${DQ_DB_PASSWORD:?à définir dans .env}
      DQ_MAIL_HOST: ${DQ_MAIL_HOST:-localhost}
      DQ_MAIL_PORT: ${DQ_MAIL_PORT:-25}
    volumes:
      - dq-storage:/data        # fichiers importés et bases DuckDB (PERF-03)
      - dq-logs:/app/logs       # journal applicatif (EXP-02)

  proxy:
    image: docker.io/library/nginx:1.27-alpine
    container_name: dq-proxy
    restart: always
    depends_on:
      - app
    ports:
      # 8443 et non 443 : les ports standard appartiennent à ÉCHO, interdit d'y toucher.
      - "8443:8443"
    volumes:
      # ",Z" sans risque : ce sont nos propres copies, jamais les fichiers d'ÉCHO.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./deploy/certs:/etc/nginx/certs:ro,Z

volumes:
  dq-pgdata:
  dq-storage:
  dq-logs:
