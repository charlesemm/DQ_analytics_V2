# Notre nginx à nous, dans un conteneur. Il n'a aucun rapport avec le nginx du système,
# qui continue de servir ÉCHO sur le port 443 sans savoir que nous existons.
server {
    listen 8443 ssl;
    server_name srv-gouv.ipscnam.ci;

    # Copie du wildcard *.ipscnam.ci, déposée par l'étape 14.4 du guide. Jamais l'original.
    ssl_certificate     /etc/nginx/certs/dq-analyzer.crt;
    ssl_certificate_key /etc/nginx/certs/dq-analyzer.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Au moins la limite d'envoi de Spring (max-request-size : 25 Mo) : un morceau de 10 Mo + marge
    client_max_body_size 25m;

    location / {
        # "app" est le nom du service : résolu sur le réseau interne de Podman,
        # sans qu'aucun port de l'application soit publié sur la machine.
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Avec forward-headers-strategy: native, l'application sait qu'on est en HTTPS
        # et fabrique des liens et des cookies corrects (SEC-03).
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;   # analyses longues
    }
}
