# DQ-Analyzer, servi sous un sous-chemin du domaine d'ÉCHO : https://echo.ipscnam.ci/dq/
# Même idée que socle.ipscnam.ci/referentiel/ : une seule adresse, un seul certificat,
# plusieurs applications derrière.
#
# ── Ce fichier n'est PAS un vhost ────────────────────────────────────────────
# Il ne contient que des « location », qui n'ont de sens qu'à l'intérieur d'un bloc
# « server ». Il ne va donc pas dans /etc/nginx/conf.d/ (chargé au niveau http, nginx
# refuserait de démarrer) mais dans /etc/nginx/snippets/, et le vhost d'ÉCHO l'appelle
# par une ligne « include ». Un fichier à part plutôt que des lignes recopiées dans le
# vhost d'ÉCHO : la modification d'ÉCHO tient en une ligne, et nos réglages à nous
# restent dans notre dépôt, à versionner avec l'application qu'ils servent.
#
# ── Installation (serveur, sudo) ─────────────────────────────────────────────
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp ~/dq-analyzer/deploy/nginx/dq-dans-echo.conf /etc/nginx/snippets/dq.conf
#   # puis, dans /etc/nginx/conf.d/echo.ipscnam.ci.conf, à l'intérieur du server 443 :
#   #     include /etc/nginx/snippets/dq.conf;
#   sudo nginx -t                 # valide la syntaxe AVANT de recharger
#   sudo systemctl reload nginx   # reload, pas restart : ne coupe ni Socle ni ÉCHO
#
# ⚠️ « nginx -t » n'est pas optionnel : un seul nginx sert Socle, ÉCHO et nous. Une
# erreur de syntaxe rechargée brutalement coupe les trois.

# « /dq » sans barre finale n'est pas « /dq/ » et n'entrerait pas dans l'emplacement
# ci-dessous : sans cette ligne, l'adresse que tout le monde tapera donne un 404 d'ÉCHO.
location = /dq {
    return 301 /dq/;
}

# « ^~ » et non un simple préfixe : il coupe court à l'évaluation des emplacements par
# expression régulière, pour qu'aucune règle d'ÉCHO ne reprenne la main sur nos adresses.
location ^~ /dq/ {
    # Au moins la limite d'envoi de Spring (max-request-size : 25 Mo) : un morceau de
    # 10 Mo + marge. Le « client_max_body_size 10M » du vhost d'ÉCHO vaut pour ses
    # routes à lui ; ici, l'import de fichiers a besoin de plus.
    client_max_body_size 25m;

    # Port publié sur la boucle locale seulement par compose.prod.yaml : rien sur le
    # réseau ne joint l'application directement. 8081, car 8000 appartient à ÉCHO.
    #
    # Pas de barre finale, et aucun chemin après le port : nginx transmet alors l'adresse
    # TELLE QUELLE, « /dq/ » compris. C'est voulu — Tomcat attend ce préfixe
    # (server.servlet.context-path, application.yml) et fabrique ses liens avec. Écrire
    # « proxy_pass http://127.0.0.1:8081/; » couperait le préfixe et donnerait un 404
    # sur toutes les pages.
    proxy_pass http://127.0.0.1:8081;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Avec forward-headers-strategy: native (application-prod.yml), l'application sait
    # qu'on est en HTTPS : ses redirections et son témoin de session sont corrects (SEC-03).
    # Plus de X-Forwarded-Port à forcer comme au temps du port 8443 : on est sur 443,
    # le port par défaut, et $host ne porte donc aucun numéro.

    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;   # profilages et analyses longues

    # Aucun « add_header » ici, volontairement : un seul suffirait à faire perdre à nos
    # pages TOUS les en-têtes de sécurité du vhost d'ÉCHO (HSTS, CSP, nosniff…), que
    # nginx n'hérite pas une fois qu'un niveau en déclare un. On les garde tels quels.
    # Ils nous conviennent : nos scripts et nos styles viennent tous de notre origine.
}
