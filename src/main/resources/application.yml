# Configuration commune à tous les profils. Valeurs propres à un environnement : application-<profil>.yml
spring:
  application:
    name: dq-analyzer
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway, jamais par Hibernate
  flyway:
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 20MB         # un morceau d'upload (10 Mo) + marge
      max-request-size: 25MB
  task:
    execution:
      simple:
        # Imports et analyses tournent en @Async sur threads virtuels. La limite borne le nombre de
        # traitements simultanés : le disque doit tenir 3 × la taille max par traitement (PERF-03).
        concurrency-limit: 4

server:
  # Port d'écoute de Tomcat, le même partout (poste de développement et conteneur) pour que les
  # adresses d'un environnement valent dans l'autre.
  port: ${DQ_PORT:8040}
  # L'application est servie sous un sous-chemin du domaine d'ÉCHO : https://echo.ipscnam.ci/dq/
  # Le nginx de l'hôte relaie /dq/ tel quel, chemin compris ; Tomcat doit donc attendre ce préfixe.
  # Il vaut aussi en développement (http://localhost:8040/dq/), pour que ce qui marche ici marche là-bas.
  # Effet de bord utile : le témoin de session est posé sur /dq et ne croise jamais celui d'ÉCHO.
  servlet:
    context-path: ${DQ_CONTEXT_PATH:/dq}
    session:
      timeout: 30m                # SEC-01
      cookie:
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false              # à réactiver quand le SMTP interne sera connu

dq:
  storage:
    path: ${DQ_STORAGE_PATH:./storage}   # fichiers importés et bases DuckDB (3 × taille max par analyse)
  upload:
    max-file-size: 2GB                   # PERF-02, paramétrable
    chunk-size: 10MB
  retention:
    days: 90                             # SEC-04
