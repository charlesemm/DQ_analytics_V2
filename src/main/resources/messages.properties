# Import de fichiers (IMP-03, IMP-05, IMP-07). Messages comprehensibles par un non-informaticien (ERG-02).
# Attention : seuls les messages a parametres passent par MessageFormat, ou l'apostrophe se double.
import.error.fichier-vide=Le fichier est vide : il ne contient aucune donnée.
import.error.aucune-donnee=Le fichier ne contient que la ligne d'en-tête : il n'y a aucune donnée à analyser.
import.error.fichier-illisible=Le fichier n'a pas pu être lu. Il est peut-être endommagé : réenregistrez-le, puis rechargez-le.
import.error.fichier-trop-grand=Le fichier dépasse la taille maximale autorisée ({0} Mo).
import.error.extension-refusee=Le fichier « {0} » n''est pas dans un format accepté. Formats acceptés : {1}.
import.error.type-inattendu=Le contenu de ce fichier ne correspond pas à son extension. Vérifiez qu'il s'agit du bon fichier et qu'il n'est pas endommagé.
import.error.separateur-indetectable=Le séparateur de colonnes n'a pas été reconnu : le fichier semble ne contenir qu'une seule colonne. Choisissez le séparateur vous-même (point-virgule, virgule ou tabulation).
import.error.entete-vide=Le fichier ne comporte aucune colonne.
import.error.encodage-inconnu=Encodage non pris en charge. Encodages acceptés : UTF-8 et Windows-1252.
import.error.separateur-inconnu=Séparateur non pris en charge. Séparateurs acceptés : point-virgule, virgule et tabulation.
import.error.guillemet-inconnu=Caractère de guillemet non pris en charge.
import.error.ligne-illisible=La lecture du fichier s''est arrêtée à la ligne {0} : cette ligne est mal formée (guillemet non fermé ou en trop).
# Tableurs (IMP-02).
import.error.classeur-illisible=Ce classeur n'a pas pu être ouvert. Il est peut-être endommagé ou protégé par un mot de passe : réenregistrez-le au format .xlsx, puis rechargez-le.
import.error.feuille-introuvable=La feuille « {0} » n''existe pas dans ce classeur. Choisissez une feuille dans la liste.
import.error.classeur-sans-feuille=Ce classeur ne contient aucune feuille.
import.error.ligne-entete-introuvable=La ligne d''en-tête indiquée (ligne {0}) est vide ou n''existe pas dans la feuille.
import.error.ligne-entete-invalide=Le numéro de la ligne d'en-tête doit être supérieur ou égal à 1.
import.error.trop-de-colonnes=Ce fichier annonce plus de {0} colonnes : il est probablement abîmé.
import.error.format-sans-feuille=Ce format de fichier ne se lit pas feuille par feuille.

# Largeur fixe, XML et JSON (IMP-08).
import.error.gabarit-absent=Ce fichier à largeur fixe a besoin d'un gabarit : indiquez la position et la longueur de chaque colonne.
import.error.gabarit-illisible=Le gabarit « {0} » n''est pas lisible. Attendu : nom:début:longueur, par exemple num_secu:1:13.
import.error.gabarit-position-invalide=La position d'une colonne commence à 1.
import.error.gabarit-longueur-invalide=La longueur d'une colonne doit être d'au moins 1 caractère.
import.error.aucun-enregistrement=Ce fichier ne contient aucun enregistrement à analyser.
import.error.chemin-introuvable=Le chemin « {0} » n''existe pas dans ce fichier.

# Archives (IMP-09).
import.error.archive-illisible=Cette archive n'a pas pu être ouverte. Elle est peut-être endommagée : recompressez le fichier, puis rechargez-le.
import.error.archive-vide=Cette archive ne contient aucun fichier.
