# Import de fichiers (IMP-03, IMP-05, IMP-07). Messages comprehensibles par un non-informaticien (ERG-02).
# Attention : seuls les messages a parametres passent par MessageFormat, ou l'apostrophe se double.
import.error.fichier-vide=Le fichier est vide : il ne contient aucune donnée.
import.error.aucune-donnee=Le fichier ne contient que la ligne d'en-tête : il n'y a aucune donnée à analyser.
import.error.fichier-illisible=Le fichier n'a pas pu être lu. Il est peut-être endommagé : réenregistrez-le, puis rechargez-le.
import.error.fichier-trop-grand=Le fichier dépasse la taille maximale autorisée ({0} Mo).
import.error.extension-refusee=Le fichier « {0} » n''est pas dans un format accepté. Formats acceptés pour le moment : csv, tsv, txt.
import.error.type-inattendu=Le contenu de ce fichier n'est pas du texte. Vérifiez qu'il s'agit du bon fichier et qu'il n'est pas endommagé.
import.error.separateur-indetectable=Le séparateur de colonnes n'a pas été reconnu : le fichier semble ne contenir qu'une seule colonne. Choisissez le séparateur vous-même (point-virgule, virgule ou tabulation).
import.error.entete-vide=Le fichier ne comporte aucune colonne.
import.error.encodage-inconnu=Encodage non pris en charge. Encodages acceptés : UTF-8 et Windows-1252.
import.error.separateur-inconnu=Séparateur non pris en charge. Séparateurs acceptés : point-virgule, virgule et tabulation.
import.error.guillemet-inconnu=Caractère de guillemet non pris en charge.
