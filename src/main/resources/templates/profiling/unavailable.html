<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{profiling.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-3" th:text="#{profiling.title}">Profil du fichier</h1>
  <div class="alert alert-warning" role="alert" th:text="${message}"></div>
  <a class="btn btn-link px-0" th:href="@{/imports/nouveau}" th:if="${canImport}"
     th:text="#{profiling.retour-import}">Importer un fichier</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
