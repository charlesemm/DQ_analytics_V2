<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{reference.apercu.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
  <h1 class="h3 mb-1" th:text="#{reference.apercu.title}">Aperçu du référentiel</h1>
  <p class="text-muted mb-1">
    <span th:text="${reference.name()}">Communes</span>
    <span class="badge bg-secondary ms-1" th:text="#{reference.version(${reference.version()})}">v1</span>
    <span class="ms-2"
          th:text="#{reference.apercu.lignes(${#numbers.formatInteger(reference.rowCount(), 0, 'WHITESPACE')})}"></span>
  </p>
  <p class="text-muted small" th:text="#{reference.apercu.aide(${previewRows})}"></p>

  <div class="table-responsive">
    <table class="table table-sm table-striped">
      <thead>
      <tr>
        <th scope="col" th:each="column : ${reference.columns()}" th:text="${column}">colonne</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="row : ${rows}">
        <td th:each="value : ${row}" th:text="${value}">valeur</td>
      </tr>
      </tbody>
    </table>
  </div>

  <a class="btn btn-link px-0" th:href="@{/references/{name}/versions(name=${reference.name()})}"
     th:text="#{reference.action.versions}">Versions</a>
  <a class="btn btn-link" th:href="@{/references}" th:text="#{reference.retour}">Retour aux références</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
